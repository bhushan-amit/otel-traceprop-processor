receivers:
  otlp:
    protocols:
      grpc:
        include_metadata: true
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "*"
          allowed_headers:
            - "*"
        include_metadata: true
  hostmetrics:
    scrapers:
      load:
      memory:
  prometheus/otelcol:
    config:
      scrape_configs:
        - job_name: 'collector-eb'
          scrape_interval: 10s
          static_configs:
            - targets: ['0.0.0.0:8888']

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 10
  batch:
    send_batch_size: 256
    send_batch_max_size: 1024
    timeout: 10s
    # https://github.com/open-telemetry/opentelemetry-collector/tree/main/processor/batchprocessor
  batch/clickhouse_metrics:
    send_batch_size: 20000
    send_batch_max_size: 50000
    timeout: 15s
  tracepropagator: {}
  transform/add_enterprise:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          # copy attribute from child spans to all spans in the trace
          - set(attributes["enterprise.id"], attributes["enterprise.id"]) where attributes["enterprise.id"] != nil
          - set(attributes["meta.status.code"], attributes["meta.status.code"]) where attributes["meta.status.code"] != nil
          - set(attributes["courierpartner.id"], attributes["courierpartner.id"]) where attributes["courierpartner.id"] != nil
  transform/drop_unneeded_resource_attributes:
    error_mode: ignore
    metric_statements:
      - context: resource
        statements:
          - delete_key(attributes, "telemetry.auto.version")
          - delete_key(attributes, "telemetry.sdk.version")
          - delete_key(attributes, "telemetry.sdk.language")
          - delete_key(attributes, "telemetry.sdk.name")
          - delete_key(attributes, "telemetry.distro.name")
          - delete_key(attributes, "telemetry.distro.version")
          - delete_key(attributes, "exception.message")
          - delete_key(attributes, "process.runtime.description")
          - delete_key(attributes, "process.command.args")
          - delete_key(attributes, "process.executable.path")
          - delete_key(attributes, "process.runtime.description")
          - delete_key(attributes, "process.runtime.name")
          - delete_key(attributes, "process.runtime.version")
          - delete_key(attributes, "exception.message")
  filter/http_metrics_drop:
    error_mode: ignore
    metrics:
      exclude:
        match_type: regexp
        metric_names:
          - http.*
  filter/clickhouse_metrics:
    error_mode: ignore
    metrics:
      include:
        match_type: regexp
        metric_names:
          - ^scylla.*
          - ^system\..*
          - ^process\..*
          - ^cpython\..*
          - ^traces.*

exporters:
  debug:
    verbosity: basic
  otlphttp/grafana_cloud:
    endpoint: "https://otlp-gateway-prod-ap-south-1.grafana.net/otlp"
    auth:
      authenticator: basicauth/grafana_cloud
  otlp/tempo:
    endpoint: "10.100.32.88:4317"
    tls:
      insecure: true
    sending_queue:
      enabled: true
      num_consumers: 8
      queue_size: 30000
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 300s
  prometheusremotewrite:
    endpoint: "http://10.100.32.79:3100/api/v1/write"  # Prometheus remote write endpoint
    target_info:
      enabled: true
    resource_to_telemetry_conversion:
      enabled: true
  otlphttp/loki:
    endpoint: "http://10.100.36.169:3100/otlp"
    tls:
      insecure: true

  otlp/hdx:
    endpoint: '10.100.46.16:4317'
    headers:
      authorization: 382b5538-925f-4661-aef3-29aff5a268be
    compression: gzip

  kafka/traces:
    protocol_version: 3.9.0
    brokers:
      - b-1.clickpostotelkafka.k5tbao.c2.kafka.ap-south-1.amazonaws.com:9092
      - b-2.clickpostotelkafka.k5tbao.c2.kafka.ap-south-1.amazonaws.com:9092
    topic: otel-traces
    encoding: otlp_proto
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 2000
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 60s
    producer:
      required_acks: 1
      compression: zstd
      flush_max_messages: 500
      max_message_bytes: 10485760

  kafka/logs:
    protocol_version: 3.9.0
    brokers:
      - b-1.clickpostotelkafka.k5tbao.c2.kafka.ap-south-1.amazonaws.com:9092
      - b-2.clickpostotelkafka.k5tbao.c2.kafka.ap-south-1.amazonaws.com:9092
    topic: otel-logs
    encoding: otlp_proto
    partition_logs_by_resource_attributes: true
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 2000
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 60s
    producer:
      required_acks: 1
      compression: zstd
      flush_max_messages: 500
      max_message_bytes: 10485760

  # Session-replay (rrweb) events — split onto their own topic so the
  # high-volume, bursty DOM stream cannot create consumer lag on the
  # critical otel-logs topic. Routed here by the routing/logs connector
  # on the rr-web.event log attribute.
  kafka/rrweb:
    protocol_version: 3.9.0
    brokers:
      - b-1.clickpostotelkafka.k5tbao.c2.kafka.ap-south-1.amazonaws.com:9092
      - b-2.clickpostotelkafka.k5tbao.c2.kafka.ap-south-1.amazonaws.com:9092
    topic: otel-rrweb
    encoding: otlp_proto
    partition_logs_by_resource_attributes: true
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 2000
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 60s
    producer:
      required_acks: 1
      compression: zstd
      flush_max_messages: 500
      max_message_bytes: 10485760

  clickhouse:
    database: default
    endpoint: http://10.100.46.16:8123
    username: default
    password: clickhouse
    ttl: 720h
    timeout: 5s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  zpages:
    endpoint: 0.0.0.0:55679

connectors:
  grafanacloud:
    host_identifiers: ["host.name"]
  routing/logs:
    default_pipelines: [logs/out-default]
    error_mode: ignore
    table:
      - context: log
        statement: route() where IsMatch(attributes["rr-web.event"], ".*")
        pipelines: [logs/out-rrweb]
  servicegraph:
    latency_histogram_buckets: [100ms, 250ms, 1s, 5s, 10s, 30s]
    store:
      ttl: 2m
      max_items: 1000
  spanmetrics:
    histogram:
      explicit:
        buckets: [100us, 1ms, 2ms, 6ms, 10ms, 100ms, 250ms, 500ms, 750ms, 1s, 2s, 5s, 10s, 30s]
    dimensions:
      - name: http.request.method
        default: GET
      - name: http.response.status_code
      - name: http.status_code
      - name: host.name
      - name: http.route
      - name: TraceParentName
        default: NOT_FOUND
      - name: enterprise.id
      - name: meta.status.code
      - name: courierpartner.id
    exemplars:
      enabled: true
    dimensions_cache_size: 1000
    aggregation_temporality: "AGGREGATION_TEMPORALITY_CUMULATIVE"
    metrics_flush_interval: 15s
    metrics_expiration: 5m
    events:
      enabled: true
      dimensions:
        - name: exception.type
        - name: exception.message
    resource_metrics_key_attributes:
      - service.name


service:
  extensions: [health_check, zpages]

  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, filter/http_metrics_drop, transform/drop_unneeded_resource_attributes, transform/add_enterprise, tracepropagator]
      exporters: [spanmetrics, kafka/traces]

    metrics/prometheus:
      receivers: [otlp, spanmetrics, hostmetrics, prometheus/otelcol]
      processors: [memory_limiter, batch, transform/drop_unneeded_resource_attributes, filter/http_metrics_drop]
      exporters: [prometheusremotewrite]

    metrics/clickhouse:
      receivers: [otlp, spanmetrics]
      processors: [memory_limiter, filter/clickhouse_metrics, batch/clickhouse_metrics]
      exporters: [clickhouse]

    # Logs in: receive, then fan out via the routing/logs connector which
    # splits rrweb session-replay events from ordinary logs on the
    # rr-web.event attribute.
    logs/in:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [routing/logs]

    # Ordinary application logs -> otel-logs topic -> otel_logs table.
    logs/out-default:
      receivers: [routing/logs]
      exporters: [kafka/logs]

    # Session-replay (rrweb) logs -> otel-rrweb topic -> hyperdx_sessions table.
    logs/out-rrweb:
      receivers: [routing/logs]
      exporters: [kafka/rrweb]